<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<!-- 这个标签告诉 Internet Explorer 浏览器使用最新的渲染引擎来呈现网页。IE=edge 指定浏览器使用最新版本的兼容模式，而不是旧版本的模式。这有助于确保网页在 IE 浏览器中的显示效果更好 -->
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />

	<link rel="icon" type="image/svg+xml" href="/vite.png" />
	<!-- 为了在移动端 兼容 防止用户随意放大缩小键盘 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<!-- 便于引擎搜索关键字 -->
	<meta name="keywords" content="博客,个人博客,daixm个人博客,前端" />

	<!-- 这个标签用于提供网页的描述，通常会在搜索引擎结果中显示。它简要描述了网页内容，有助于吸引用户点击进入 -->
	<meta name="description" content="daixm个人博客旨在分享前端技术、心得、和美图汇总" />

	<!-- 这个标签设置内容安全策略（CSP），指定浏览器在加载资源时应优先使用安全的 HTTPS 连接，而不是不安全的 HTTP 连接。upgrade-insecure-requests 指示浏览器自动将所有不安全的请求升级为安全请求，以提高网站的安全性 -->
	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

	<title>daixmblog</title>

</head>

<body>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
		}
		.first-loading {
            position: absolute;
            z-index: 1000000000;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #2980b9, #6dd5fa, #ffffff);
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            animation: fadeIn 0.8s linear forwards;
			flex-direction: column;
        }

        @keyframes fadeIn {
			0%{
				opacity: 1;
			}
            50% {
				transform: scale(0.6);
            }
            100% {
				transform: scale(0.4);
				display: none;
				opacity: 0;
            }
        }

		.xm3d{
			position: relative;
            width:  8rem;
            height: 8rem;
            transform-style: preserve-3d;
            animation: zuan 6s linear alternate infinite;
		}
		@keyframes zuan {
            0% {
                transform: rotateX(-30deg) rotateY(0deg);
            }

            100% {
                transform: rotateX(-30deg) rotateY(360deg);
            }
        }

        .q1,.h2,.z3,.y4 {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgb(26, 26, 26), #6dd5fa);
        }

        .q1 {
            transform: translateZ(4rem);
        }

        .h2 {
            transform: rotateY(180deg) translateZ(4rem);
        }

        .z3 {
            transform: rotateY(-90deg) translateZ(4rem);
        }

        .y4 {
            transform: rotateY(90deg) translateZ(4rem);
        }

        .s5,.x6 {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .s5 {
            transform: rotateX(90deg) translateZ(4rem);
            background-color: rgb(26, 26, 26);
        }

        .x6 {
            background-color: #fff;
            transform: rotateX(-90deg) translateZ(100px);
            box-shadow: 0 0 150px 30px #000;
            filter: blur(30px);
        }

		/* 下面的动态效果 */
		.xmblog {
			margin-top: 150px;
			--w: 15ch;
			font-weight: bold;
			font-family: kaiti;
			line-height: 1.4em;
			letter-spacing: var(--w);
			width: var(--w);
			overflow: hidden;
			white-space: nowrap;
			font-size: 2.2rem;
			color: #fff;
			text-shadow:
				calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
				calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff;
			animation: l20 3s infinite linear;
		}

		.xmblog:before {
			content: "daixm的个人博客";
		}

		@keyframes l20 {
			9.09% {
				text-shadow:
					calc(0*var(--w)) -10px #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			18.18% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) -10px #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			27.27% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) -10px #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			36.36% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) -10px #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			45.45% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) -10px #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			54.54% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) -10px #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			63.63% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) -10px #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			72.72% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) -10px #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) 0 #fff
			}

			81.81% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) -10px #fff, calc(-9*var(--w)) 0 #fff
			}

			90.90% {
				text-shadow:
					calc(0*var(--w)) 0 #fff, calc(-1*var(--w)) 0 #fff, calc(-2*var(--w)) 0 #fff, calc(-3*var(--w)) 0 #fff, calc(-4*var(--w)) 0 #fff,
					calc(-5*var(--w)) 0 #fff, calc(-6*var(--w)) 0 #fff, calc(-7*var(--w)) 0 #fff, calc(-8*var(--w)) 0 #fff, calc(-9*var(--w)) -10px #fff
			}
		}

		

	</style>

	<noscript>
		<strong>
			很抱歉，如果没有 JavaScript 支持，网页 将不能正常工作。请启用浏览器的 JavaScript 然后继续。
		</strong>
	</noscript>
	<div class="first-loading">
		<div class="xm3d">
			<div class="q1"></div>
			<div class="h2"></div>
			<div class="z3"></div>
			<div class="y4"></div>
			<div class="s5"></div>
			<div class="x6"></div>
		</div>
		<div class="xmblog"></div>
	</div>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
